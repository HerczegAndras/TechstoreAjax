<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMaster</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        
       
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
            
            
            <div class="kepek lg:col-span-5 flex flex-col md:flex-row gap-4">
              
                <div class="flex-1 border border-slate-100 rounded-lg overflow-hidden flex items-center justify-center p-4 bg-slate-50">
                    <img id="main-image" src="" alt="main product" class="max-w-full h-auto object-contain">
                </div>
               
            <div class="flex md:flex-col gap-2 justify-between" id="thumbnails-container">
                <img id="thumbnails1" alt="" class="w-16 h-16 object-cover rounded-lg border border-slate-200 cursor-pointer hover:border-blue-500">
                <img id="thumbnails2" alt="" class="w-16 h-16 object-cover rounded-lg border border-slate-200 cursor-pointer hover:border-blue-500">
                <img id="thumbnails3" alt="" class="w-16 h-16 object-cover rounded-lg border border-slate-200 cursor-pointer hover:border-blue-500">
                <img id="thumbnails4" alt="" class="w-16 h-16 object-cover rounded-lg border border-slate-200 cursor-pointer hover:border-blue-500">
            </div>
            </div>

           
            <div class="gaminglaptop lg:col-span-7 flex flex-col md:flex-row gap-6">
                
            
                <div class="flex-1 space-y-4">
                   
                <span id="badge" class="inline-block bg-blue-600 text-white text-xs font-semibold px-2 py-0.5 rounded mb-2">Új</span>



                    
                    <div>
                        <h1 id="termek" class="text-2xl md:text-3xl font-bold text-slate-900"></h1>
                        <p id="leiras" class="text-slate-500 text-sm mt-1"></p>
                    </div>

                   
                    <div class="flex items-center gap-2 text-amber-400 text-sm">
                    <div class="flex" id="rating-stars">★★★★★</div>
                    <span id="rating-text" class="text-slate-500 font-medium"></span>
                    </div>

                   
                    <div class="pt-2">
                        <div id="ar" class="text-3xl font-extrabold text-slate-900"></div>
                        <div id="raktar" class="inline-flex items-center gap-1.5 mt-3 bg-emerald-100 text-emerald-800 text-xs font-medium px-3 py-1 rounded-full">
                            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                            <span id="raktar-text">Raktáron</span>
                        </div>
                    </div>

                    
                    <div class="  flex gap-3 pt-2">
                        <button class=" w-15 flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition">
                            <i data-lucide="shopping-cart" class="w-10 h-5"></i>
                            Kosárba
                        </button>
                        <button class=" w-15 border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition">
                            <i data-lucide="heart" class="w-10 h-5"></i>
                            Kedvencekhez
                        </button>
                    </div>
                </div>

               
                <div class="gyartoi w-full md:w-52 bg-slate-50 p-3.5 rounded-xl border border-slate-200 flex flex-col justify-between gap-3 text-xs self-start">
    <div class="flex items-center gap-3">
        <i data-lucide="building-2" class="w-4 h-4 text-slate-500 shrink-0"></i>
        <div>
            <div class="text-[11px] text-slate-400">Gyártó</div>
            <div id="gyarto-ertek" class="font-semibold text-slate-700"></div>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <i data-lucide="globe" class="w-4 h-4 text-slate-500 shrink-0"></i>
        <div>
            <div class="text-[11px] text-slate-400">Származási ország</div>
            <div id="orszag-ertek" class="font-semibold text-slate-700"></div>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <i data-lucide="shield-check" class="w-4 h-4 text-slate-500 shrink-0"></i>
        <div>
            <div class="text-[11px] text-slate-400">Garancia</div>
            <div id="garancia-ertek" class="font-semibold text-slate-700"></div>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <i data-lucide="truck" class="w-4 h-4 text-slate-500 shrink-0"></i>
        <div>
            <div class="text-[11px] text-slate-400">Szállítás</div>
            <div id="szallitas-ertek" class="font-semibold text-slate-700"></div>
        </div>
    </div>
</div>
            </div>
        </div>

       
        <div class="flex border-b border-slate-200 mb-8">
            <p class="py-3 px-6 border-b-2 border-blue-600 font-semibold text-blue-600 cursor-pointer">Leirás</p>
            <p class="py-3 px-6 text-slate-500 hover:text-slate-800 font-medium cursor-pointer">Tulajdonságok</p>
            <p class="py-3 px-6 text-slate-500 hover:text-slate-800 font-medium cursor-pointer">Vélemények</p>
        </div>

        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            
            <div class="szoveg/icon space-y-6">
                <p id="hosszuleiras" class="text-slate-600 leading-relaxed text-sm"></p>

                
                <div class="grid grid-cols-2 gap-3" id="ikonos-kartyak">
                   
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col items-center text-center">
                        <i data-lucide="zap" class="w-6 h-6 text-slate-700 mb-2"></i>
                        <span class="text-xs font-semibold text-slate-700">Kiemelkedo teljesitmeny</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col items-center text-center">
                        <i data-lucide="gamepad-2" class="w-6 h-6 text-slate-700 mb-2"><span></span></i>
                        <span class="text-xs font-semibold text-slate-700">Tokeletes jatekelmeny</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col items-center text-center">
                        <i data-lucide="monitor" class="w-6 h-6 text-slate-700 mb-2"></i>
                        <span class="text-xs font-semibold text-slate-700">Lenyugozo kijelzo</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col items-center text-center">
                        <i data-lucide="settings" class="w-6 h-6 text-slate-700 mb-2"></i>
                        <span class="text-xs font-semibold text-slate-700">Fejleszteshez idealis</span>
                    </div>
                </div>
            </div>

          
            <div class="jellemzok">
            <h3 class="font-bold text-slate-700 mb-2 text-sm">Főbb jellemzők</h3>
            <div class="space-y-1" id="jellemzok-lista">
       
                </div>

            </div>

            <!-- vasarloi velemenyek -->
            <div class="vasarloi velemenyek space-y-4">
                <h3 class="font-bold text-slate-900">Vásárloi Vélemények</h3>
                
                <div id="velemenyek-lista" class="space-y-3">
                 
                </div>

                <a href="#" class="inline-flex items-center gap-1 text-sm font-semibold text-blue-600 hover:underline">
                    szes vélemény megtekintése →
                </a>
            </div>

        </div>

    </div>

    <script src="app.js"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
